name: Bug report
description: Report a reproducible problem with the editor, rendering, or export.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve BetterMathType. Please include enough detail to reproduce the problem.

        Do not include private documents or equations unless they are needed to demonstrate the bug.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Copy for Word places the equation on the clipboard at the wrong size.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact actions that trigger the problem.
      placeholder: |
        1. Open the app
        2. Enter the LaTeX below
        3. Select Size -> 14 pt
        4. Select Copy for Word
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: A vector equation should be placed on the clipboard at 14 pt.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: The fallback dialog appears, or the pasted equation is the wrong size.
    validations:
      required: true
  - type: textarea
    id: latex
    attributes:
      label: LaTeX input
      description: If the bug depends on a specific equation, paste it here. This field is optional.
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Editor input
        - Rendering or MathJax output
        - Copy or export
        - Preview layout
        - Theme or styling
        - Deployment
        - Other
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag or commit SHA, if known.
      placeholder: 1.0.0 or 25514a1
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag and drop images or short recordings here if they help explain the problem.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can reproduce this issue with the latest version.
          required: true
