name: Feature request
description: Suggest a new capability or an improvement to an existing one.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Explain the problem first, then the solution you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what gets in the way?
      placeholder: When I paste equations into Word, I need to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or tools you have tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor input
        - Rendering or MathJax output
        - Copy or export
        - Preview layout
        - Theme or styling
        - Accessibility
        - Translations
        - Deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples, references, or links that clarify the request.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This request is about BetterMathType, not a general MathJax or MathLive question.
          required: true
